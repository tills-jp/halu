<body>                                                                                          <!-- ▼body部 スタート -->
<div class="container-fluid bg-secondary">                                             <!-- ▼container-fluid スタート -->
<form id="mainForm">                                                                              <!-- ▼form スタート -->
<div class="d-flex flex-column">                                                    <!-- ▼d-flex flex-column スタート -->
<!-- ================================================================================================================= -->


<!-- ================================================================================================================= -->
<!-- ★▼halu-page-header -->
<div componentID="Header" props-Title="受注明細一覧"></div>
<!-- ================================================================================================================= -->


<!-- ================================================================================================================= -->
<div class="halu-header-btn">                                                        <!-- ▼halu-header-btn スタート -->
<!-- ================================================================================================================= -->
  <!-- ★フェーズ2デザイン適用: 本文左上の大見出し＋戻るボタンをUserDetailMainte/CustomerListMainteと同じ見出し行構成へ
       （モード付きタイトルは singleRecordForm.view.mixin が .halu-page-title へ反映。id/name・キーバインドは不変。
        実行ボタンは明細一覧カード内上部のボタン行へ移動） -->
  <div class="d-flex justify-content-between align-items-center">
    <div class="halu-page-title">受注明細一覧</div>
    <div class="me-2">
      <button type="button" class="btn btn-info btn-sm halu-btn-outline" id="戻る" name="戻る" style="width:110px;">戻る：Esc</button>
    </div>
  </div>
<!-- ================================================================================================================= -->
</div>                                                                              <!-- ▲halu-header-btn エンド -->
<!-- ================================================================================================================= -->


<!-- ================================================================================================================= -->
<div class="halu-header-input mt-3">                                               <!-- ▼halu-header-input スタート -->
<!-- ================================================================================================================= -->
  <div class="d-flex justify-content-center">

    <!-- ★フェーズ2デザイン適用: 受注ヘッダ情報をUserDetailMainteと同じdivグリッドの白カードフォームへ再構成
         （旧table構成にあったtdのinput内ネスト（受注日・合計金額行）のタグ入れ子ミスも解消。
          4項目のinputはhalu-ds-*・class・disabled・tabIndexを維持して移設） -->
    <div class="halu-form-card halu-card">

      <div class="halu-form-section">
        <div class="halu-form-section-title">受注ヘッダ情報</div>
        <div class="halu-form-grid">
          <div class="halu-form-item">
            <span class="halu-form-label">受注番号</span>
            <input type="text" class="form-control form-control-sm text-start" halu-ds-id="header" halu-ds-field="受注番号" disabled tabIndex=-1>
          </div>
          <div class="halu-form-item">
            <span class="halu-form-label">顧客氏名</span>
            <input type="text" class="form-control form-control-sm text-start" halu-ds-id="header" halu-ds-field="顧客氏名" disabled tabIndex=-1>
          </div>
          <div class="halu-form-item">
            <span class="halu-form-label">受注日</span>
            <input type="text" class="form-control form-control-sm text-start" halu-ds-id="header" halu-ds-field="受注日" disabled tabIndex=-1>
          </div>
          <div class="halu-form-item">
            <span class="halu-form-label">合計金額</span>
            <input type="text" class="form-control form-control-sm text-start" halu-ds-id="header" halu-ds-field="合計金額" disabled tabIndex=-1>
          </div>
        </div>
      </div>

    </div>

  </div>
<!-- ================================================================================================================= -->
</div>                                                                                <!-- ▲halu-header-input エンド -->
<!-- ================================================================================================================= -->


<!-- ================================================================================================================= -->
<div class="halu-detail-input mt-3">                                               <!-- ▼halu-detail-input スタート -->
<!-- ================================================================================================================= -->
  <div class="d-flex justify-content-center">

    <!-- ★フェーズ2デザイン適用: 明細一覧をCustomerListMainteと同じ白カード様式へ（テーブルid・列構成・halu-ds-*は不変） -->
    <div id="scrollable-Table" style="width:1017px;">   <!-- 1000px + 17px -->
      <!-- ★フェーズ2デザイン適用: 実行ボタンをカード内上部の左寄せボタン行へ移動（ラベル・id/name・F1キーバインド・モード別表示切替は不変） -->
      <div class="d-flex mb-2">
        <button type="button" class="btn btn-info btn-sm" id="実行" name="実行" style="width:90px;">実行：F1</button>
      </div>
      <div id="scrollable-HTable" style="width:1000px;">
        <table id="mainTableH" class="table table-sm table-bordered my-0" style="width:1000px;table-layout:fixed;">
          <thead class="table-dark">
            <!-- C-044: 商品選択列を追加。商品名称は選択結果の表示専用になったため幅を拡張し、
                 他列を詰めてテーブル全体幅（1000px）は変更していない
                 （55+45+60+250+80+90+95+145+180=1000） -->
            <tr>
              <th class="text-center" style="width:55px;">削除</th>
              <th class="text-center" style="width:45px;">行</th>
              <th class="text-center" style="width:60px;">商品</th>
              <th class="text-center" style="width:250px;">商品名称</th>
              <th class="text-center" style="width:80px;">数量</th>
              <th class="text-center" style="width:90px;">単価</th>
              <th class="text-center" style="width:95px;">小計</th>
              <th class="text-center" style="width:145px;">納期日</th>
              <th class="text-center" style="width:180px;">備考</th>
            </tr>
          </thead>
        </table>
      </div>

      <!-- ★フェーズ2デザイン適用: スクロール高さの直書きを撤去しprogram.cssへ移動（可変化） -->
      <div id="scrollable-DTable" style="width:1017px;overflow-x:auto;overflow-y:auto;">   <!-- 1000px + 17px -->
        <table id="mainTable" class="table table-striped table-sm table-bordered my-0" style="width:1000px;table-layout:fixed;">
          <tbody class="tbody-light">
            <tr>
              <td style="width:55px;">
                <input type="checkbox" class="form-control m-2" halu-ds-id="detail" halu-ds-field="削除" style="width:40px;">
              </td>
              <td style="width:45px;">
                <input type="text" class="form-control form-control-sm text-center" halu-ds-id="detail" halu-ds-field="明細番号" readonly tabIndex = -1>
              </td>
              <!-- C-044: 商品選択ダイアログの起動ボタン。行が複製されるためidは付けずname属性で識別する
                   （idは重複できない。イベントは$(document)への委譲登録なので複製行でも発火する）
                   2026-08-31 依頼者指示「選択ボタンの色を実行ボタンと同じにして」により
                   halu-btn-outline（白抜き）を外し、実行ボタンと同じ塗りつぶしの .btn-info にした -->
              <td style="width:60px;">
                <button type="button" class="btn btn-info btn-sm" name="商品選択" style="width:52px;">選択</button>
              </td>
              <!-- C-044: 商品名称は商品マスタからの選択結果（受注時点のスナップショット）。自由入力を廃止しreadonly -->
              <td style="width:250px;">
                <input type="text" class="form-control form-control-sm text-start" halu-ds-id="detail" halu-ds-field="商品名称" readonly tabIndex = -1>
              </td>
              <td style="width:80px;">
                <input type="text" class="form-control form-control-sm text-end" halu-ds-id="detail" halu-ds-field="受注数量">
              </td>
              <td style="width:90px;">
                <input type="text" class="form-control form-control-sm text-end" halu-ds-id="detail" halu-ds-field="受注単価">
              </td>
              <td style="width:95px;">
                <input type="text" class="form-control form-control-sm text-end" halu-ds-id="detail" halu-ds-field="受注金額" readonly tabIndex = -1>
              </td>
              <td style="width:145px;">
                <input type="date" class="form-control form-control-sm text-end" halu-ds-id="detail" halu-ds-field="納期日">
              </td>
              <td style="width:180px;">
                <input type="text" class="form-control form-control-sm text-start" halu-ds-id="detail" halu-ds-field="備考">
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
<!-- ================================================================================================================= -->
</div>                                                                                <!-- ▲halu-detail-input エンド -->

<!-- ================================================================================================================= -->

<div componentID="Footer"></div>

<!-- ================================================================================================================= -->
</div>                                                                                <!-- ▲d-flex flex-column エンド -->
</form>                                                                                             <!-- ▲form エンド -->
</div>                                                                                   <!-- ▲container-fluid エンド -->

</html>
