              </div>
              <div>
                <button type="button" class="btn btn-info btn-sm" id="検索Dialog" name="検索Dialog"

                      <th class="text-center" style="width:300px;">商品名称</th>
                      <th class="text-center" style="width:100px;">標準単価</th>

                  </thead>

                      <td halu-ds-id="detail" halu-ds-field="商品名称" class="text-start" style="width:300px;"></td>
