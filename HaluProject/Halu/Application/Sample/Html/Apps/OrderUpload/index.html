<div class="halu-header-btn">                                                        <!-- ▼halu-header-btn スタート -->
<!-- ================================================================================================================= -->
  <!-- ★フェーズ2デザイン適用 D-018: 本文左上の大見出し＋戻るボタンをUserDetailMainte等と同じ見出し行構成へ統合（id/name・キーバインドは不変） -->

    <div class="halu-page-title">受注データアップロード</div>
    <div class="me-2">
      <button type="button" class="btn btn-info btn-sm halu-btn-outline" id="戻る" name="戻る" style="width:110px;">戻る：Esc</button>
    </div>
  </div>
<!-- ================================================================================================================= -->
</div>                                                                                  <!-- ▲halu-header-btn エンド -->
<!-- ================================================================================================================= -->

<!-- ================================================================================================================= -->
<div class="halu-header-input mt-4">                                              <!-- ▼halu-header-input スタート -->
<!-- ================================================================================================================= -->
  <!-- ★フェーズ2デザイン適用 D-018: 実行ボタンをコンテンツ領域上部の左寄せボタン行へ移動（id/name・F1キーバインドは不変） -->
  <div class="mb-3">
    <button type="button" class="btn btn-info btn-sm mx-1" id="実行" name="実行" style="width:84px;">実行：F1</button>
  </div>
<main role="main" class="container">

  <div class="row">
    <div class="col-md-6 col-sm-12">
      
      <!-- Our markup, the important part here! -->
      <div id="drag-and-drop-zone" class="dm-uploader p-5">
        <h3 class="mb-5 mt-5 text-muted">Drag &amp; drop files here</h3>

        <!-- D-024 UAT指摘: ボタン色を実行ボタン（テーマ.btn-info系の深緑）に合わせる（旧btn-primary） -->
        <div class="btn btn-info btn-block mb-5">
            <span>Open the file Browser</span>
            <input type="file" title='Click to add Files' />
        </div>
      </div><!-- /uploader -->

    </div>
    <div class="col-md-6 col-sm-12">
      <div class="card h-100">
        <div class="card-header">
          File List
        </div>

        <ul class="list-unstyled p-2 d-flex flex-column col" id="files">
          <li class="text-muted text-center empty">No files uploaded.</li>
        </ul>
      </div>
    </div>
  </div><!-- /file list -->

  <div class="row">
    <div class="col-12">
       <div class="card h-100">
        <div class="card-header">
          Debug Messages
        </div>

        <ul class="list-group list-group-flush" id="debug">
          <li class="list-group-item text-muted empty">Loading plugin....</li>
        </ul>
      </div>
    </div>
  </div> <!-- /debug -->

</main> <!-- /container -->


<!-- File item template -->
<script type="text/html" id="files-template">
  <li class="media d-flex align-items-start">

    <div class="flex-grow-1 mb-1">
      <p class="mb-2">
        <strong>%%filename%%</strong> - Status: <span class="text-muted">Waiting</span>
      </p>
      <div class="progress mb-2">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
          role="progressbar"
          style="width: 0%" 
          aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        </div>
      </div>
      
      <p class="controls mb-2">
        <!-- 
        <button href="#" class="btn btn-sm btn-primary start" role="button">Start</button>
        -->
        <button href="#" class="btn btn-sm btn-danger cancel" role="button">Cancel</button>
      </p>
      
      <hr class="mt-1 mb-1" />
    </div>
  </li>
</script>

<!-- Debug item template -->
<script type="text/html" id="debug-template">
  <li class="list-group-item text-%%color%%"><strong>%%date%%</strong>: %%message%%</li>
</script>
